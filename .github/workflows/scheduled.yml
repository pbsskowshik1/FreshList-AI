name: Spotify Playlist Scanner

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes (GitHub's minimum)
  workflow_dispatch:         # also lets you trigger it manually

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit the updated queue file

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Spotify token cache
        run: echo '${{ secrets.SPOTIFY_TOKEN_CACHE }}' | base64 -d > .cache-spotify_cleanup

      - name: Run scanner (once)
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: http://127.0.0.1:8888/callback
        run: python playlist_scanner.py --once

      - name: Commit updated queue to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_removals.jsonl
          git diff --staged --quiet || git commit -m "chore: scanner update [skip ci]"
          git push
